<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Splash Lab: Perakit Roket Air</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10284f;--mut:#5a7298;--pn:rgba(255,255,255,.9);--cd:#eaf3ff;--ln:#c8dcf8;--hot:#ff5b45;--sun:#ffc928;--teal:#12b5a6;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8f1ff;--mut:#9fb8e6;--pn:rgba(13,26,56,.9);--cd:#182b58;--ln:#2d4680;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e8f1ff;--mut:#9fb8e6;--pn:rgba(13,26,56,.9);--cd:#182b58;--ln:#2d4680;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:#bfe6ff;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}canvas.over{outline:5px dashed var(--sun);outline-offset:-10px}
button{font:inherit;color:inherit;cursor:pointer;white-space:nowrap}:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.pill{background:var(--pn);border:0;border-radius:999px;padding:2px 14px;font-weight:600;box-shadow:0 3px 0 rgba(16,40,79,.2);backdrop-filter:blur(8px);line-height:1.6}
#top{position:fixed;top:calc(var(--sa) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:6}#top b{font-size:20px}#top .g{display:flex;gap:6px}
.panel,#dock{position:fixed;background:var(--pn);border-radius:22px;padding:10px 14px;box-shadow:0 6px 0 rgba(16,40,79,.2);backdrop-filter:blur(10px);z-index:4;transition:transform .5s cubic-bezier(.5,0,.2,1)}
#dock{left:12px;right:268px;bottom:calc(var(--sb) + 12px);height:164px;display:flex;flex-direction:column}
#R{right:12px;width:244px;top:calc(var(--sa) + 54px);bottom:calc(var(--sb) + 108px);overflow:auto}
body.fly #dock{transform:translateY(150%)}body.fly #R,body.fly #bar{transform:translateX(130%)}
h3{margin:0 0 4px;font-size:16px}.hint{margin:4px 0;font-size:12px;color:var(--mut);line-height:1.3}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{border:0;background:var(--cd);border-radius:10px;padding:0 12px;font-size:14px;font-weight:600;line-height:1.7}.tabs button.on{background:var(--ink);color:var(--pn)}
.grid{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 4px;flex:1;scrollbar-width:thin}
.part{touch-action:pan-x;flex:0 0 92px;border:2px solid var(--ln);background:var(--cd);border-radius:14px;padding:4px 2px;text-align:center;line-height:1.1;cursor:grab;transition:transform .15s,border-color .15s}
.part:hover{transform:translateY(-3px);border-color:var(--hot)}.part.on{border-color:var(--hot);background:var(--pn);box-shadow:0 0 0 2px var(--hot) inset}
.part svg{display:block;margin:0 auto 1px}.part b{font-size:13px;display:block}.part i{font-size:11px;font-style:normal;color:var(--mut)}
.slot{display:flex;align-items:center;gap:8px;border:2px dashed var(--ln);border-radius:12px;padding:1px 8px;margin:4px 0;cursor:pointer;background:var(--cd);transition:all .15s}
.slot svg{flex:0 0 26px;height:26px}.slot span{font-size:11px;color:var(--mut);display:block;line-height:1}.slot b{font-size:14px;line-height:1.05;display:block}
body.drag .slot{opacity:.4}body.drag .slot.ok{opacity:1;border-color:var(--sun);animation:pulse .8s infinite alternate}.slot.hov{background:var(--sun);color:#10284f;transform:scale(1.04);border-style:solid}.slot.bad{animation:shake .3s}
@keyframes pulse{to{box-shadow:0 0 0 5px rgba(255,201,40,.45)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ghost{position:fixed;left:0;top:0;width:92px;pointer-events:none;z-index:50;margin:-40px 0 0 -46px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.row{display:grid;grid-template-columns:1fr auto;font-size:13px;margin:4px 0}.row b{color:var(--hot)}.row input{grid-column:1/-1;width:100%;accent-color:var(--hot);margin:0}
.gau{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.gau div{font-size:12px}.gau b{display:block;font-size:14px;line-height:1.1}.gau u{display:block;height:6px;border-radius:4px;background:var(--ln);overflow:hidden}.gau u i{display:block;height:100%;background:var(--teal);transition:width .3s}
.sw i{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto}
#bar{position:fixed;right:12px;width:244px;bottom:calc(var(--sb) + 12px);height:88px;background:var(--pn);border-radius:22px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:center;z-index:5;box-shadow:0 6px 0 rgba(16,40,79,.2);transition:transform .5s}
#pred{font-size:13px;font-weight:600}#go{flex:1;border:0;border-radius:16px;background:var(--hot);color:#fff;font-size:24px;font-weight:700;box-shadow:0 5px 0 #bd3524}#go:active{transform:translateY(4px);box-shadow:0 1px 0 #bd3524}
#mtab{display:none}
#hud{position:fixed;top:calc(var(--sa) + 54px);left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:5}body.fly #hud{display:flex}
.tile{width:104px;height:64px;background:var(--pn);border-radius:16px;padding:6px 8px;text-align:center;box-shadow:0 3px 0 rgba(16,40,79,.2);backdrop-filter:blur(8px);display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:24px;line-height:1}.tile span{font-size:11px;color:var(--mut);line-height:1}.tile u{display:block;height:5px;border-radius:4px;background:var(--ln);overflow:hidden}.tile u i{display:block;height:100%;width:0;background:var(--sun)}
#cams{position:fixed;left:50%;transform:translate(-50%,200%);bottom:calc(var(--sb) + 14px);display:flex;gap:6px;align-items:center;background:var(--pn);border-radius:999px;padding:6px;box-shadow:0 4px 0 rgba(16,40,79,.2);backdrop-filter:blur(8px);z-index:5;transition:transform .5s}
body.fly #cams{transform:translateX(-50%)}#cams button{border:0;background:var(--cd);border-radius:999px;padding:2px 14px;font-weight:600;line-height:1.7}#cams button.on{background:var(--ink);color:var(--pn)}#cams button:disabled{opacity:.4;cursor:not-allowed}#cams .sp{width:2px;height:22px;background:var(--ln)}#cams .y{background:var(--sun);color:#10284f}
#rec{position:fixed;inset:0;display:none;pointer-events:none;z-index:3;box-shadow:inset 0 0 140px rgba(0,0,0,.55);border:14px solid transparent;border-image:linear-gradient(#0000,#0000) 1}
#rec.on{display:block}#rec span{position:absolute;left:24px;top:calc(var(--sa) + 62px);color:#fff;font-weight:700;text-shadow:0 2px 4px #000}#rec span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#f33;margin-right:8px;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
#toast{position:fixed;top:calc(var(--sa) + 126px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--pn);padding:2px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;z-index:9}#toast.on{animation:tst 2s}@keyframes tst{10%,80%{opacity:1}0%{transform:translate(-50%,-10px)}}
#big{position:fixed;inset:0;display:grid;place-items:center;font-size:min(30vw,200px);font-weight:700;color:#fff;text-shadow:0 7px 0 rgba(16,40,79,.35);pointer-events:none;z-index:6}#big.pop{animation:pop .8s ease-out}@keyframes pop{from{transform:scale(2);opacity:0}30%{opacity:1}to{transform:scale(1)}}
#res{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,25,60,.45);padding:16px;z-index:20;overflow:auto}#res[hidden]{display:none}

.btns{display:flex;gap:8px}.btns button{flex:1;border:0;border-radius:16px;padding:6px;font-weight:700;font-size:16px;background:var(--cd)}.btns .p{background:var(--teal);color:#fff}
@media (max-width:860px){
#dock{left:8px;right:8px;height:150px;bottom:calc(var(--sb) + 8px)}#R{left:8px;right:8px;width:auto;top:auto;bottom:calc(var(--sb) + 8px);height:44vh}
body[data-m="L"] #R,body[data-m="R"] #dock{display:none}

#mtab{display:flex;position:fixed;left:8px;bottom:calc(var(--sb) + 166px);gap:6px;z-index:5}#mtab button{border:0;background:var(--pn);border-radius:999px;padding:2px 14px;font-weight:600}
body.fly #dock,body.fly #R,body.fly #bar{transform:translateY(160%)}body.fly #mtab{display:none}
#cams{max-width:calc(100vw - 12px);overflow-x:auto}#cams button{padding:0 10px;font-size:13px}.tile{width:84px}.tile b{font-size:20px}#top .g .pill{padding:0 10px;font-size:13px}#top b{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function thumb(c,o){const f='fill="currentColor"';let s='';
 if(c==='nose'){const h=Math.min(30,8+o.h*6),a=[];for(let i=0;i<=12;i++){const t=i/12;a.push([20+14*o.f(t),36-h*t])}for(let i=12;i>=0;i--){const t=i/12;a.push([20-14*o.f(t),36-h*t])}s=`<polygon ${f} points="${a.join(' ')}"/>`}
 else if(c==='body'){const w=10*o.wid+5,h=Math.min(34,8+o.vol*7/o.wid);s=`<rect ${f} x="${20-w}" y="${38-h}" width="${w*2}" height="${h}" rx="${o.pf?9:5}" opacity=".85"/>`+(o.ring?`<rect x="${20-w}" y="${38-h/2-1.5}" width="${w*2}" height="3" fill="#ff5b45"/>`:'')}
 else if(c==='fins'){const k=o.s*1.5;s=`<rect ${f} x="17" y="3" width="6" height="32" rx="3"/>`;if(o.s)s+=[-1,1].map(d=>`<polygon ${f} points="${FS[o.sh].map(q=>[(d<0?17:23)+d*-1*q[0]*k*-1,31-q[1]*k].join(',')).join(' ')}"/>`).join('')}
 else if(c==='noz'){const h=o.mm*.7;s=`<path ${f} d="M9 6H31L${20+h} 30H${20-h}Z"/><rect ${f} x="${20-h}" y="30" width="${h*2}" height="5"/>`}
 else if(c==='paint')s=`<circle cx="20" cy="20" r="14" fill="${o.c}" stroke="#10284f" stroke-opacity=".3" stroke-width="2"/>`;
 else if(c==='pat'){if(o.id==='plain')s=`<circle cx="20" cy="20" r="14" fill="${COL[p.paint]}" stroke="#10284f" stroke-opacity=".3" stroke-width="2"/>`;else if(o.id==='all')s=[0,1,2].map(k=>`<image href="${STKSRC[k]}" x="${[3,21,12][k]}" y="${[3,3,19][k]}" width="17" height="17"/>`).join('');else s=`<image href="${STKSRC[o.k]}" x="2" y="2" width="36" height="36"/>`}
 else s={chute:`<path ${f} d="M5 18A15 15 0 0 1 35 18Z"/><path d="M6 18L20 36L34 18" stroke="currentColor" fill="none" stroke-width="1.5"/>`,cam:`<rect ${f} x="7" y="12" width="26" height="18" rx="4"/><circle cx="20" cy="21" r="5" fill="#fff"/>`,ball:`<circle ${f} cx="20" cy="22" r="13"/>`,led:`<circle ${f} cx="20" cy="20" r="6"/><path d="M20 4V10M20 30V36M4 20H10M30 20H36M9 9L13 13M31 9L27 13M9 31L13 27M31 31L27 27" stroke="currentColor" stroke-width="2.5"/>`,tail:`<path d="M20 4C30 12 10 20 20 28S26 34 22 37" fill="none" stroke="currentColor" stroke-width="5"/>`,canard:`<rect ${f} x="17" y="4" width="6" height="32" rx="3"/><path ${f} d="M17 14L6 22L17 22ZM23 14L34 22L23 22Z"/>`}[o.id];
 return `<svg viewBox="0 0 40 40" width="40" height="40">${s}</svg>`}
const sel=(c,o)=>c==='extra'?has(o.id):p[c]===o.id;
function drawTabs(){$('#tabs').innerHTML=CATS.map(([k,n])=>`<button data-c="${k}" class="${k===tab?'on':''}">${n}</button>`).join('');const gr=$('#grid'),sx=gr.scrollLeft;
 gr.innerHTML=PARTS[tab].map(o=>`<button class="part ${sel(tab,o)?'on':''} ${tab==='paint'?'sw':''}" data-cat="${tab}" data-id="${o.id}">${thumb(tab,o)}<b>${o.n}</b><i>${DESC[tab](o)}</i></button>`).join('');gr.scrollLeft=sx}
function drawSlots(){$('#slots').innerHTML=CATS.map(([c,n])=>{const o=c==='extra'?{id:p.extra[0]||'none'}:get(c),nm=c==='extra'?(p.extra.length?PARTS.extra.filter(x=>has(x.id)).map(x=>x.n).join(', '):'Kosong'):o.n;return `<div class="slot" data-cat="${c}">${c==='extra'&&!p.extra.length?'<svg viewBox="0 0 40 40"></svg>':thumb(c,o)}<div><span>${n}</span><b>${nm}</b></div></div>`}).join('')}
$('#tabs').onclick=e=>{if(e.target.dataset.c){tab=e.target.dataset.c;drawTabs()}};
$('#slots').onclick=e=>{const s=e.target.closest('.slot');if(s){tab=s.dataset.cat;drawTabs();document.body.dataset.m='L'}};
document.querySelectorAll('#mtab button').forEach(b=>b.onclick=()=>document.body.dataset.m=b.dataset.m);
['water','bar'].forEach(k=>$('#s_'+k).oninput=e=>{p[k]=+e.target.value;build()});

/* ---------- Audio & musik ---------- */
let AC,mute=false,musOff=false,master,nb,hs,mg,mt,mnx=0,ms=0;
function audio(){if(AC){AC.resume();return}AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
 const n=AC.sampleRate*2;nb=AC.createBuffer(1,n,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 hs={s:AC.createBufferSource(),f:AC.createBiquadFilter(),g:AC.createGain()};hs.s.buffer=nb;hs.s.loop=true;hs.f.type='bandpass';hs.f.frequency.value=1500;hs.g.gain.value=0;hs.s.connect(hs.f);hs.f.connect(hs.g);hs.g.connect(master);hs.s.start()}
function tone(f,d=.12,type='sine',v=.25,t0=0,f2){if(!AC||mute)return;const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d)}
function burst(d=.7,f0=2500,f1=300,v=.7){if(!AC||mute)return;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain(),t=AC.currentTime;s.buffer=nb;f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(gn);gn.connect(master);s.start(t,Math.random());s.stop(t+d)}
const musTo=v=>{if(mg)mg.gain.setTargetAtTime(musOff?0:v,AC.currentTime,.6)};
function note(fr,d,type,v,t){const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.value=fr;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.02);gn.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(gn);gn.connect(mg);o.start(t);o.stop(t+d+.05)}
const CH=[[48,52,55,59],[45,48,52,55],[41,45,48,52],[43,47,50,55]],PE=[72,74,76,79,81,84],hz=n=>440*Math.pow(2,(n-69)/12);
function sched(){while(mnx<AC.currentTime+.4){const i=ms%8,ch=CH[(ms>>3)%4];note(hz(ch[[0,1,2,3,2,1,3,2][i]]+12),.45,'triangle',.07,mnx);if(!i){note(hz(ch[0]-12),1.2,'sine',.2,mnx);note(hz(ch[2]),2.4,'sine',.05,mnx)}if(i%2&&Math.random()<.35)note(hz(PE[Math.random()*6|0]),.9,'sine',.05,mnx);mnx+=.3125;ms++}}
function musStart(){if(mt||!AC)return;mg=AC.createGain();mg.gain.value=0;mg.connect(master);mnx=AC.currentTime+.2;mt=setInterval(sched,80);musTo(.8)}
addEventListener('pointerdown',()=>{audio();musStart();loadWin()},{once:true});
$('#snd').onclick=()=>{audio();mute=!mute;$('#snd').textContent='Efek: '+(mute?'mati':'nyala');if(mute&&hs)hs.g.gain.value=0};
$('#mus').onclick=()=>{audio();musStart();musOff=!musOff;$('#mus').textContent='Musik: '+(musOff?'mati':'nyala');musTo(state==='design'?.8:0)};
